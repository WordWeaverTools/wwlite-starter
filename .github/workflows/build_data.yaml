name: Build Data Files
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Config file name"
        required: true
        default: "config.wwlite.json"




permissions:
  contents: write

jobs:
  build-data:
    #concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Check out WordWeaver-Lite
        uses: actions/checkout@v7
        with:
          repository: WordWeaverTools/WordWeaverLite
          ref: main
          path: .

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: "3.8"

      - name: Install DataBuilder Dependecies
        working-directory: ./DataBuilder/
        run: |
          pip install --upgrade pip==24.0
          pip install -r requirements.txt

      - name: Build 🔧
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          python DataBuilder/src/main.py -f "config/$CONFIG_FILE" 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          {
            echo "## Data Structuring:"
            cat build.log
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Python script exited with code 1."
            exit 1
          fi
          exit "$EXIT_CODE"
          cp VerbApp/src/assets/JSON ../autogenerated-output/

      - name: Commit and Push
        env:
          TRIGGERED_BY: ${{ github.triggering_actor }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Stage all new and changed files
          |
          {
            cat autogenerated-output/warning.md
            echo "## Run Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "- **Triggered by:** @${TRIGGERED_BY}"
            echo ""

            cat "$GITHUB_STEP_SUMMARY"
          } > autogenerated-output/README.md


          git add autogenerated-output/
          # Only commit and push if there are actual changes to prevent workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generated files [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
